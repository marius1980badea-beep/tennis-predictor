[project]
name = "tennis-predictor"
version = "0.1.0"
description = "Tennis match prediction system with point-level Monte Carlo simulation for sports betting analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tennis Predictor Team" }]
keywords = ["tennis", "prediction", "machine-learning", "sports-betting", "monte-carlo"]

dependencies = [
    # Core data manipulation
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    
    # Database & Supabase
    "supabase>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy>=2.0.30",
    
    # Data validation
    "pandera[polars]>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    
    # HTTP & async
    "httpx>=0.27.0",
    "tenacity>=8.3.0",   # Retry logic
    
    # ML (will be used in later phases)
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "scipy>=1.13.0",
    
    # CLI & UX
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    
    # Logging & monitoring
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    
    # Date handling
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.7.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "altair>=5.3.0",
]

[project.scripts]
tennis-predictor = "tennis_predictor.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_predictor"]

# ============================================================================
# Ruff: linter + formatter (replaces black, isort, flake8)
# ============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in arg defaults (FastAPI/Click pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow asserts in tests
"scripts/**/*.py" = ["T201"]  # allow print in scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# Pytest configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: unit tests (fast, no external dependencies)",
    "integration: integration tests (require database)",
    "slow: slow tests (skip with -m 'not slow')",
    "anti_leakage: tests that verify no temporal data leakage",
]

[tool.coverage.run]
source = ["src/tennis_predictor"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ============================================================================
# MyPy configuration
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true  # Many tennis libs lack stubs
